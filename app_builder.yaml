      tags:
      - "Data Notifications"
      description: "Updates an existing data notification. The data notification name\
        \ is given in the path.\nThis operation updates the properties passed in the\
        \ request. Other properties are left untouched."
      requestBody:
        $ref: "#/components/requestBodies/DataNotificationMetadata"
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
    delete:
      operationId: "deleteDataNotification"
      summary: "Delete data notification"
      tags:
      - "Data Notifications"
      description: "Deletes the data notification whose name is given in the path."
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
