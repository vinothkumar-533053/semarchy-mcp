        \ load. The load name is given in the path.\n\nNote that this operation updates\
        \ all configuration properties. A missing property is set to null in the target\
        \ continuous load."
      requestBody:
        $ref: "#/components/requestBodies/ContinuousLoadInMetadata"
      responses:
        "204":
