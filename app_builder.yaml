  /app-builder/data-locations/{dloc-name}/data-notifications/{name}/status:
    parameters:
    - $ref: "#/components/parameters/data-location-name"
    - $ref: "#/components/parameters/data-notification-name"
    get:
      operationId: "getDataNotificationStatus"
      summary: "Get data notification status"
      tags:
      - "Data Notifications"
      description: "Returns the status and runtime information of the data notification\
        \ whose name is given in the path."
      responses:
        "200":
          $ref: "#/components/responses/DataNotificationStatusMetadata"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations/{dloc-name}/data-notifications/{name}/kill:
    parameters:
    - $ref: "#/components/parameters/data-location-name"
    - $ref: "#/components/parameters/data-notification-name"
    post:
      operationId: "killDataNotification"
      summary: "Kill data notification"
      tags:
      - "Data Notifications"
      description: "Kills the running notification for the data notification whose\
        \ name is given in the path. This notification is suspended."
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations/{dloc-name}/data-notifications/{name}/resume:
    parameters:
    - $ref: "#/components/parameters/data-location-name"
    - $ref: "#/components/parameters/data-notification-name"
    post:
      operationId: "resumeDataNotification"
      summary: "Resume data notification"
      tags:
      - "Data Notifications"
      description: "Resumes the suspended data notification whose name is given in\
        \ the path."
      requestBody:
        $ref: "#/components/requestBodies/DataNotificationResume"
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
components:
  parameters:
    model-name:
      name: "name"
      in: "path"
      description: "Name of the model"
      required: true
      schema:
        type: "string"
    edition-key:
      name: "key"
      in: "path"
      description: "Version number of the model edition, containing the branch number\
        \ and the model edition number."
      required: true
      schema:
        type: "string"
        format: "x.y"
    data-location-name:
      name: "dloc-name"
      in: "path"
      description: "Data location name"
      required: true
      schema:
        type: "string"
    notification-policy-name:
      name: "name"
      in: "path"
      description: "Notification policy name"
      required: true
      schema:
        type: "string"
    continuous-load-name:
      name: "name"
      in: "path"
      description: "Continuous load name"
      required: true
      schema:
        type: "string"
    data-notification-name:
      name: "name"
      in: "path"
      description: "Name of the data notification"
      required: true
      schema:
        type: "string"
    data-notification-processing-status:
      name: "$processingStatus"
      in: "query"
      description: "Processing status of the data notification"
      schema:
        type: "string"
        enum:
        - "PROCESSING"
        - "SUSPENDED"
        - "SUSPENDING"
        - "WAITING"
  schemas:
    InternalSecret:
      type: "object"
      description: "Secret stored in xDM"
      properties:
        type:
          type: "string"
          enum:
          - "secret-internal"
        value:
          type: "string"
          description: "Value of the secret"
          example: "val"
    ExternalSecret:
      type: "object"
      description: "Secret stored in an external secrets manager"
      properties:
        type:
          type: "string"
          enum:
          - "secret-external"
        secretsManagerAlias:
          type: "string"
          description: "Alias of the secret manager"
          example: "SecretManager"
        secretName:
          type: "string"
          description: "Secret name"
          example: "mysecret"
        secretProperty:
          type: "string"
          description: "Secret property"
          example: "prop"
    NotSecret:
      type: "string"
      description: "Plain text value"
      example: "val"
    Secret:
      oneOf:
      - $ref: "#/components/schemas/InternalSecret"
      - $ref: "#/components/schemas/ExternalSecret"
    MaybeSecret:
      oneOf:
      - $ref: "#/components/schemas/InternalSecret"
      - $ref: "#/components/schemas/ExternalSecret"
      - $ref: "#/components/schemas/NotSecret"
    ExecutionEngineMetadata:
      type: "object"
      description: "Execution engine metadata"
      properties:
        status:
          type: "string"
          description: "Status of the execution engine.\n\n* `RUNNING`: the engine\
            \ is up and running.\n`STOPPED`: the engine is stopped."
          enum:
          - "RUNNING"
          - "STOPPED"
    ModelMetadata:
      type: "object"
      description: "Model information"
      properties:
        name:
          type: "string"
          description: "Name of the model"
          example: "CustomerB2CDemo"
        label:
          type: "string"
          description: "Label of the model"
          example: "Customer B2C Demo"
        description:
          type: "string"
          description: "Description of the model"
          example: "This model is used as a tutorial for a Customer B2C Hub"
        usedIn:
          type: "array"
          description: "List of data locations where this model is deployed."
          items:
            type: "string"
            description: "Data Location"
            example: "CustomerB2CDemo"
    BranchMetadata:
      type: "object"
      description: "Model branch information"
      properties:
        id:
          type: "integer"
          description: "Model branch ID"
          example: "0"
        name:
          type: "string"
          description: "Model branch name"
          example: "CustomerB2CDemo_Root"
        label:
          type: "string"
          description: "Model branch label"
          example: "Customer B2C Demo Root branch"
        description:
          type: "string"
          description: "Model branch description"
          example: "The root branch for Customer B2C Demo"
    ModelEditionMetadata:
      type: "object"
      description: "Model edition information"
      properties:
        branch:
          $ref: "#/components/schemas/BranchMetadata"
        id:
          type: "integer"
          description: "Model edition number in the branch"
          example: "0"
        description:
          type: "string"
          description: "Model edition description"
          example: "First version of this model."
        status:
          type: "string"
          description: "Model edition status. An edition may be:\n\n* `OPEN`: An open\
            \ model edition can be modified, and is considered as being designed.\n\
            * `CLOSED`: A closed model edition can no longer be modified.\n* `LOCKED`:\
            \ An open model edition may be temporary moved to that status to prevent\
            \ changes."
          enum:
          - "CLOSED"
          - "LOCKED"
          - "OPEN"
        key:
          type: "string"
          format: "x.y"
          description: "Version number of the model edition, containing the branch\
            \ number and the model edition number."
          example: "0.0"
    BranchCreate:
      type: "object"
      description: "Branch information"
      required:
      - "name"
      - "label"
      - "description"
      properties:
        name:
          type: "string"
          description: "Model branch name"
          example: "CustomerB2CDemo_Maintenance"
        label:
          type: "string"
          description: "Model branch label"
          example: "Customer B2C Demo Maintenance"
        description:
          type: "string"
          description: "Model branch description"
          example: "Maintenance branch for Customer B2C Demo"
    ModelCreate:
      type: "object"
      description: "Model information"
      required:
      - "name"
      - "label"
      - "description"
      - "branch"
      properties:
        name:
          type: "string"
          description: "Name of the model"
          example: "CustomerB2CDemo"
        label:
          type: "string"
          description: "Label of the model"
          example: "Customer B2C Demo"
        description:
          type: "string"
          description: "Description of the model"
          example: "This model is used as a tutorial for a Customer B2C Hub"
        branch:
          $ref: "#/components/schemas/BranchCreate"
    ModelEditionClose:
      type: "object"
      description: "Closed model edition description"
      required:
      - "description"
      properties:
        description:
          type: "string"
          description: "Comment  explaining why the edition was closed."
          example: "Releasing the milestone 1 to production."
    DataLocationMetadata:
      type: "object"
      description: "Data location information"
      properties:
        id:
          type: "string"
          description: "Data location's unique identifier"
          example: "bc3f3628-4f43-11e9-a0a3-0800273ee3f3"
        name:
          type: "string"
          description: "Name of the data location"
          example: "CustomerB2CDemo"
        type:
          type: "string"
          description: "Type of the data location:\n\n* `DEV`: Development data location.\n\
            * `PROD`: Product data location."
          enum:
          - "DEV"
          - "PROD"
        label:
          type: "string"
          description: "Label of the data location"
          example: "Customer B2C Demo"
        description:
          type: "string"
          description: "Description of the data location"
          example: "Customer B2C data hub"
        dataSource:
          type: "string"
          description: "Data location's datasource name"
          example: "CustomerB2CDemo"
        dbType:
          type: "string"
          description: "Data location database type"
          example: "ORACLE"
        dbName:
          type: "string"
          description: "Data location database name"
          example: " "
        dbSchema:
          type: "string"
          description: "Data location database schema"
          example: "DLOC_1"
        modelName:
          type: "string"
          description: "Name of the deployed model"
          example: "CustomerB2CDemo"
        modelEditionKey:
          type: "string"
          format: "x.y"
          description: "Version number of the model edition, containing the branch\
            \ number and the model edition number."
          example: "0.0"
        deploymentDate:
          type: "string"
          format: "YYYY-MM-DDTHH:mm:ss.sssZ"
          description: "Date of the latest deployment on this data location. "
          example: "2018-01-25T12:15:00.000Z"
        status:
          type: "string"
          description: "Status of the data location.\n\nA data location available\
            \ should be in the `DL_READY` status.\n\nA data location requiring a an\
            \ upgrade is in the `NEEDS_UPGRADE`\_state, and a data location that was\
            \ moved to maintenance mode by an administrator is in a `MAINTENANCE`status.\n\
            \nOther statuses are internal."
          enum:
          - "CREATING_REPO_OBJECTS"
          - "DEPLOYING_ME_AND_JOBS"
          - "DL_READY"
          - "INSTALLING_STATIC_DDL"
          - "INSTALL_JOB_FAILED"
          - "INSTALL_JOB_RUNNING"
          - "MAINTENANCE"
          - "UPGRADE_FAILED"
          - "UPGRADING"
          - "NEEDS_UPGRADE"
    DataLocationCreate:
      type: "object"
      description: "Data location creation request"
      required:
      - "name"
      - "type"
      - "label"
      - "dataSource"
      - "modelName"
      - "modelEditionKey"
      properties:
        name:
          type: "string"
          description: "Name of the data location"
          example: "CustomerB2CDemo"
        type:
          type: "string"
          description: "Type of the data location:\n\n* `DEV`: Development data location.\n\
            * `PROD`: Product data location."
          enum:
          - "DEV"
          - "PROD"
        label:
          type: "string"
          description: "Label of the data location"
          example: "Customer B2C Demo"
        description:
          type: "string"
          description: "Description of the data location"
          example: "Customer B2C data hub"
        dataSource:
          type: "string"
          description: "Data location's datasource name"
          example: "CustomerB2CDemo"
        modelName:
          type: "string"
          description: "Name of the deployed model"
          example: "CustomerB2CDemo"
        modelEditionKey:
          type: "string"
          format: "x.y"
          description: "Version number of the model edition, containing the branch\
            \ number and the model edition number."
          example: "0.0"
    DataLocationDelete:
      type: "object"
      description: "Drop schema request"
      properties:
        dropSchema:
          type: "string"
          description: "This parameter should contain `DROP` to activate the schema\
            \ deletion."
          example: "DROP"
    DataLocationDeploy:
      type: "object"
      description: "Deployed model information"
      properties:
        modelName:
          type: "string"
          description: "Name of the deployed model"
          example: "CustomerB2CDemo"
        modelEditionKey:
          type: "string"
          format: "x.y"
          description: "Version number of the model edition, containing the branch\
            \ number and the model edition number."
          example: "0.0"
    DataLocationChangeStatus:
      type: "object"
      description: "Data location status change request"
      properties:
        status:
          type: "string"
          enum:
          - "DL_READY"
          - "MAINTENANCE"
          description: "New status:\n\n* `DL_READY`: Ready. A data location in this\
            \ status is fully available.\n* `MAINTENANCE`: Maintenance. A data location\
            \ in this status cannot be accessed. It does not accept incoming batches\
            \ but completes its current batches. New loads cannot be initialized and\
            \ existing loads cannot be submitted."
    PurgeJobs:
      type: "object"
      description: "Job purge filter"
      properties:
        jobTypes:
          type: "array"
          description: "List of job types to purge."
          items:
            type: "string"
            description: "A job type"
            enum:
            - "INSTALL_DDL_JOB"
            - "INTEGRATION_JOB"
            - "PURGE_JOB"
        jobNames:
          type: "array"
          description: "List of job name patterns. A job which name matches any of\
            \ the pattern is considered for the purge. Each pattern is expressed with\
            \ a SQL 'Like' syntax, using the `_` and `%` wildcards. "
          items:
            type: "string"
            description: "A job name pattern"
            example: "_ustomer%"
        jobOwners:
          type: "array"
          description: "List of job owner name patterns. A job which owner's name\
            \ matches any of the pattern is considered for the purge. Each pattern\
            \ is expressed with a SQL 'Like' syntax, using the `_` and `%` wildcards. "
          items:
            type: "string"
            description: "Job owner name pattern"
            example: "%doe%"
        jobStatus:
          type: "array"
          description: "List of job status to purge."
          items:
            type: "string"
            description: "A job status"
            enum:
            - "DONE"
            - "ERROR"
            - "RUNNING"
            - "STOPPED"
            - "STARTING"
            - "SUSPENDED"
            - "WARNING"
        period:
          type: "string"
          description: "Period to consider for the purge.\n\nIt is expressed with\
            \ `after | before <number> <time_unit>`, where `<time_unit>` is one of\
            \ _execution_, _executions_, _second_, _seconds_, _minute_, _minutes_,\
            \ _day_, _days_, _week_, _weeks_, _month_, _months_\n\nExamples\n\n* `before\
            \ 7 days`: All logs older than 7 days \n* `after 1 week` : All logs from\
            \ the past week\n* `after 100 executions`: The last 100 executed jobs\n\
            * `before 100 executions`: All but the last 100 executed jobs"
          example: "before 7 days"
    PurgeJobsResult:
      type: "object"
      description: "Number of purged jobs"
      properties:
        deletedJobInstances:
          type: "string"
          description: "Number of deleted jobs"
          example: "17"
    PurgeDeploymentHistory:
      type: "object"
      description: "Deployment history purge filter"
      properties:
        minDeploymentDate:
          type: "string"
          format: "YYYY-MM-DDTHH:mm:ss.sssZ"
          description: "Minimum date of deployment history to delete."
          example: "2018-01-25T12:15:00.000Z"
        maxDeploymentDate:
          type: "string"
          format: "YYYY-MM-DDTHH:mm:ss.sssZ"
          description: "Maximum date of deployment history to delete."
          example: "2022-11-20T10:10:00.000Z"
    PurgeDeploymentHistoryResult:
      type: "object"
      description: "Number of purged deployment history records"
      properties:
        purgedDeploymentHistoryRecords:
          type: "integer"
          description: "Number of purged deployment history records"
          example: "17"
    NotificationPolicyMetadata:
      type: "object"
      description: "Notification policy configuration"
      properties:
        name:
          type: "string"
          description: "Notification policy name"
          example: "EmailForErrors"
        label:
          type: "string"
          description: "Notification policy label"
          example: "Email For Errors"
        description:
          type: "string"
          description: "Notification policy description"
          example: "Send this email if any job fails for this data location."
        notificationServer:
          type: "string"
          description: "Notification server used to send the notifications"
          example: "CorporateSMTP"
        useComplexCondition:
          type: "boolean"
          description: "Indicates whether the complex condition expression or the\
            \ criteria entered in the condition are used to trigger the notification. "
        complexCondition:
          type: "string"
          description: "Groovy condition to trigger the notification."
          example: "BatchStatus != 'DONE'"
        condition:
          type: "object"
          description: "Criteria to select the completed jobs for which a notification\
            \ is sent."
          properties:
            jobNamePattern:
              type: "string"
              description: "Name of the job to take into account for the notification.\
                \ Use the `_` and `%` wildcards to represent one or any number of\
                \ characters."
              example: "%"
            notifyOnJobFailure:
              type: "boolean"
              description: "Indicates whether to send this notification when the job\
                \ fails."
            notifyOnJobSuccess:
              type: "boolean"
              description: "Indicates whether to send this notification when the job\
                \ succeeds."
            totalRowCountThreshold:
              type: "integer"
              description: "Maximum number of total records allowed before a notification\
                \ is sent."
              example: "10000000"
            errorCountThreshold:
              type: "integer"
              description: "Maximum number of errors allowed before a notification\
                \ is sent."
              example: "100"
            insertCountThreshold:
              type: "integer"
              description: "Maximum number of inserted records allowed before a notification\
                \ is sent."
              example: "100000"
            updateCountThreshold:
              type: "integer"
              description: "Maximum number of updates allowed before a notification\
                \ is sent."
              example: "100000"
            deleteCountThreshold:
              type: "integer"
              description: "Maximum number of deleted records allowed before a notification\
                \ is sent."
              example: "1000"
            mergeCountThreshold:
              type: "integer"
              description: "Maximum number of merged records allowed before a notification\
                \ is sent."
              example: "100000"
        payload:
          type: "string"
          description: "Payload sent in the notification. This is text content generated\
            \ using Groovy template."
          example: "An error occurred for job $JobName"
        properties:
          type: "object"
          description: "Notification configuration properties. These properties depend\
            \ on the notification server used."
    ContinuousLoadOutMetadata:
      type: "object"
      description: "Continuous load configuration"
      properties:
        name:
          type: "string"
          description: "Continuous load name"
          example: "CustomerUpdates"
        description:
          type: "string"
          description: "Continuous load description"
          example: "Process customer updates every hour."
        active:
          type: "boolean"
          description: "Indicates whether this continuous load is active"
        programName:
          type: "string"
          description: "Program name indicated as submitting this load"
          example: "CustomerAutomation"
        onSubmitJob:
          type: "string"
          description: "Integration job submitted by the load."
          example: "INTEGRATE_CUSTOMERS"
        submitInterval:
          type: "integer"
          description: "Interval in second between submissions."
          example: "3600"
        submitAs:
          type: "string"
          description: "Name of the user submitting the load. "
          example: "integration_processor"
        loadId:
          type: "integer"
          description: "Load ID of the continuous load.\n\nThis load ID is generated\
            \ by the platform."
          example: "869"
    ContinuousLoadInMetadata:
      type: "object"
      description: "Continuous load configuration"
      properties:
        name:
          type: "string"
          description: "Continuous load name"
          example: "CustomerUpdates"
        description:
          type: "string"
          description: "Continuous load description"
          example: "Process customer updates every hour."
        active:
          type: "boolean"
          description: "Indicates whether this continuous load is active"
        programName:
          type: "string"
          description: "Program name indicated as submitting this load"
          example: "CustomerAutomation"
        onSubmitJob:
          type: "string"
          description: "Integration job submitted by the load."
          example: "INTEGRATE_CUSTOMERS"
        submitInterval:
          type: "integer"
          description: "Interval in second between submissions."
          example: "3600"
        submitAs:
          type: "string"
          description: "Name of the user submitting the load. "
          example: "integration_processor"
    PurgeScheduleMetadata:
      type: "object"
      description: "Purge schedule configuration"
      properties:
        cronExpression:
          type: "string"
          description: "Cron expression defining the execution schedule for the purge\
            \ job"
          example: "0 0 0 ? * 1"
        active:
          type: "boolean"
          description: "Indicate whether the purge schedule is active or not"
        purgeRepositoryArtifacts:
          type: "boolean"
          description: "Indicate whether to prune repository artifact for which all\
            \ the data is purged."
    DataNotificationMetadata:
      type: "object"
      description: "Data notification configuration"
      properties:
        name:
          type: "string"
          description: "Name of the data notification"
          example: "TestNotification"
        description:
          type: "string"
          description: "Description of the data notification"
          example: "Description of the data notification"
        lowBatchId:
          type: "integer"
          description: "Low batch ID used for the next execution of this notification"
          example: "1"
        namedQuery:
          type: "string"
          description: "Named query defining the changed records dataset sent in the\
            \ notification."
          example: "TestNamedQuery"
        runAsUser:
          type: "string"
          description: "User whose profile information is used for resolving model\
            \ variables possibly used in the named query. The access privileges of\
            \ this user are not taken into account to filter the named query data."
          example: "semadmin"
        namedQueryViewType:
          type: "string"
          description: "Type of data (Golden, Master, etc) sent in the notification"
          example: "GD"
        rootRecordsLimit:
          type: "integer"
          description: "Maximum number of root records allowed in the dataset. If\
            \ a trigger causes more than this number of root records to be processed,\
            \ the notification will automatically fail"
          example: "1000"
        namedQueryParams:
          type: "object"
          description: "Named query parameters"
          additionalProperties:
            x-additionalPropertiesName: "Named query parameter name"
            type: "object"
            properties:
              type:
                type: "string"
                description: "Type of the parameter used by the named query"
                enum:
                - "LITERAL"
                - "VARIABLE"
              value:
                type: "string"
                description: "Value of the parameter used by the named query"
                example: "test"
        triggerActive:
          type: "boolean"
          description: "Status of the notification trigger. Active data notifications\
            \ run on a given schedule or when a batch completes"
        triggerType:
          type: "string"
          description: "Event triggering this notification"
          enum:
          - "ON_BATCH_COMPLETE"
          - "ON_SCHEDULE"
        cronExpression:
          type: "string"
          format: "cron"
          description: "Cron schedule"
          example: ""
        watchedEntities:
          type: "array"
          description: "A notification triggered on Batch Complete only runs when\
            \ the executed job affects one of the watched entities. Leave this field\
            \ empty to watch all entities"
          items:
            type: "string"
            description: "List of watched entities"
            example: "[\"Entity1\",\"Entity2\",\"Entity3\"]"
        recordsPerMessage:
          type: "integer"
          description: "When this property is set, the changed records dataset are\
            \ split into multiple messages, each containing this number of records.\
            \ Otherwise, all records are sent in a single message."
          example: "10"
        notifyOnEmptyDataset:
          type: "boolean"
          description: "Indicates whether a notification must be sent when the changed\
            \ record dataset is empty"
        maxRetries:
          type: "integer"
          description: "Number of retries in case of an error when sending messages\
            \ to the target. After all retries, the notification is considered failed\
            \ and future notifications are automatically suspended."
          example: "1"
        retryInterval:
          type: "integer"
          description: "Time in seconds between two retries"
          example: "10"
        targetType:
          type: "string"
          description: "Target of the notification messages"
          enum:
          - "JMS"
          - "KAFKA"
          - "REST"
        targetProperties:
          type: "object"
          description: "Properties used to configured the target"
          additionalProperties:
            $ref: "#/components/schemas/MaybeSecret"
        jms:
          type: "object"
          description: "Properties of the JMS target"
          properties:
            destination:
              type: "string"
              description: "Name of the JMS destination this Data Notification should\
                \ send messages to. Use \"queue/\" or \"topic/\" prefix to set the\
                \ destination type. Without prefix, queue is assumed."
              example: "queue/xdmtest"
            username:
              $ref: "#/components/schemas/MaybeSecret"
            password:
              $ref: "#/components/schemas/Secret"
        kafka:
          type: "object"
          description: "Properties of the Kafka target"
          properties:
            topic:
              type: "string"
              description: "Name of the Kafka topic this notification must send messages\
                \ to"
              example: "xdmtest"
        rest:
          type: "object"
          description: "Properties of the Rest target"
          properties:
            requestUrl:
              type: "string"
              description: "URL of the REST endpoint. It should include HTTP/S"
              example: "http://localhost:8080"
            httpTimeout:
              type: "integer"
              description: "Timeout for the HTTP request in seconds. After this time,\
                \ the REST call is considered failed."
              example: "60"
    DataNotificationStatusMetadata:
      type: "object"
      description: "Status summary of the data notification"
      properties:
        processingStatus:
          type: "string"
          description: "Processing status of this data notification"
          enum:
          - "PROCESSING"
          - "SUSPENDED"
          - "SUSPENDING"
          - "WAITING"
        triggerActive:
          type: "boolean"
          description: "Status of the notification trigger. Active data notifications\
            \ run on a given schedule or when a batch completes"
        lowBatchId:
          type: "integer"
          description: "Low batch ID used for the next execution of this notification"
          example: "#1"
        latestNotificationLog:
          type: "object"
          description: "Log of the latest notification instance"
          properties:
            notificationLogId:
              type: "integer"
              description: "Identifier of the notification log"
              example: "1"
            executionStatus:
              type: "string"
              description: "Execution status of this notification"
              enum:
              - "FAILED"
              - "KILLED"
              - "RUNNING"
              - "SUCCEEDED"
              - "WAITING_FOR_RETRY"
            updated:
              type: "string"
              description: "Last update of this notification"
              format: "YYYY-MM-DDTHH:mm:ss.sssZ"
            message:
              type: "string"
              description: "Error or warning message"
              example: "TestNotification failed while sending message"
            lowBatchId:
              type: "integer"
              description: "Low batch ID processed by this notification"
              example: "1"
            highBatchId:
              type: "integer"
              description: "High batch ID processed by this notification"
              example: "2"
            attempts:
              type: "integer"
              description: "Number of attempts to run this notification"
              example: "1"
            recordCount:
              type: "integer"
              description: "Number of records sent by this notification"
              example: "8"
            messageCount:
              type: "integer"
              description: "Number of messages sent by this notification"
              example: "3"
            queryDuration:
              type: "integer"
              description: "Duration of the named query execution"
              example: "1"
            sendingDuration:
              type: "integer"
              description: "Duration of the message sending process"
              example: "10"
    DataNotificationResume:
      type: "object"
      description: "Configuration of the resume action"
      properties:
        pendingNotificationsBehavior:
          type: "string"
          description: "Defines how pending notifications must be handled"
          enum:
          - "SKIP"
          - "PROCESS_IN_ONE_BATCH"
