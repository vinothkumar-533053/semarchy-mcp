openapi: "3.0.0"
servers:
- url: "http://localhost:8088/semarchy/api/rest"
info:
  version: ""
  title: "Model and Application Management"
  description: "This API allows to manage models as well as their deployments to data\
    \ locations."
security:
- basicAuth: []
  apiKeyAuth: []
tags:
- name: "Execution Engine"
  description: "Retrieve the status of the execution engine, start and stop the execution\
    \ engine."
- name: "Models"
  description: "Create, export/import and manage model editions and translations. "
- name: "Data Locations"
  description: "Create, delete, upgrade data locations. Deploy model editions to existing\
    \ data locations."
- name: "Notification Policies"
  description: "List, create and configure notification policies for the data location."
- name: "Continuous Loads"
  description: "List, create and configure continuous loads for the data location.\n"
- name: "Purge Schedule"
  description: "Configure the purge schedule for the data location."
- name: "Data Notifications"
  description: "List, configure, delete and manage data notifications."
paths:
  /app-builder/execution-engine:
    get:
      operationId: "getExecutionEngine"
      summary: "Get Status"
      tags:
      - "Execution Engine"
      description: "Returns the status of the execution engine (Note: only available\
        \ for active nodes)."
      responses:
        "200":
          $ref: "#/components/responses/ExecutionEngineMetadata"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/execution-engine/start:
    post:
      operationId: "startExecutionEngine"
      summary: "Start"
      tags:
      - "Execution Engine"
      description: "Starts the execution engine and the batch poller (Note: only available\
        \ for active nodes)."
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/execution-engine/stop:
    post:
      operationId: "stopExecutionEngine"
      summary: "Stop"
      tags:
      - "Execution Engine"
      description: "Stops the execution engine and the batch poller (Note: only available\
        \ for active nodes)."
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/model-imports:
    post:
      operationId: "importModelEditionToDeployment"
      summary: "Import model edition"
      tags:
      - "Models"
      description: "Imports the request file as a new model edition. \n\nWhen importing\
        \ a model edition, the model and the branch containing this model edition\
        \ are automatically created as needed. \n\nThis operation corresponds to the\
        \ *Import* action. It preserves the IDs of all model objects. It is intended\
        \ to import to a _deployment_ repository a _closed_ model edition.\n\nTo create\
        \ a new model from a model export in a _design_ repository, use the _Create\
        \ model_ operation to create a blank model and then use the _Import-Replace\
        \ model edition_ operation to replace this blank model by the content of the\
        \ model export file.\n\nWhen the operation completes successfully, the response\
        \ is a redirection (HTTP 303: See Other) to the newly created model edition\
        \ information."
      requestBody:
        $ref: "#/components/requestBodies/ModelEdition"
      responses:
        "303":
          $ref: "#/components/responses/Redirection303"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/models:
    get:
      operationId: "getModels"
      summary: "List models"
      tags:
      - "Models"
      description: "Returns a list of the models available in the repository."
      responses:
        "200":
          $ref: "#/components/responses/ModelMetadataList"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
    post:
      operationId: "createModel"
      summary: "Create model"
      tags:
      - "Models"
      description: "Create a new model and a model edition with version number 0.0."
      requestBody:
        $ref: "#/components/requestBodies/ModelCreate"
      responses:
        "201":
          $ref: "#/components/responses/Success201"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "409":
          $ref: "#/components/responses/ClientError409"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/models/{name}:
    parameters:
    - $ref: "#/components/parameters/model-name"
    get:
      operationId: "getModel"
      summary: "Get model information"
      tags:
      - "Models"
      description: "Returns the details of the model whose name is given in the path."
      responses:
        "200":
          $ref: "#/components/responses/ModelMetadata"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
    delete:
      operationId: "deleteModel"
      summary: "Delete model"
      tags:
      - "Models"
      description: "Deletes the model whose name is given in the path. This operation\
        \ deletes the model and all its editions, and cannot be undone."
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/models/{name}/editions:
    parameters:
    - $ref: "#/components/parameters/model-name"
    get:
      operationId: "getModelEditions"
      summary: "List model editions"
      tags:
      - "Models"
      description: "Returns a list of the model editions for the model whose name\
        \ is given in the path."
      responses:
        "200":
          $ref: "#/components/responses/ModelEditionMetadataList"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/models/{name}/editions/{key}:
    parameters:
    - $ref: "#/components/parameters/model-name"
    - $ref: "#/components/parameters/edition-key"
    get:
      operationId: "getModelEdition"
      summary: "Get model edition information"
      tags:
      - "Models"
      description: "Returns the details of a model edition whose name and key are\
        \ given in the path."
      responses:
        "200":
          $ref: "#/components/responses/ModelEditionMetadata"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
    delete:
      operationId: "deleteModelEdition"
      summary: "Delete model edition"
      tags:
      - "Models"
      description: "Deletes a model edition along with all the related objects (logical\
        \ model, deployment history, ...). Only the model editions that are closed,\
        \ are not deployed in any data location and are not the parent model edition\
        \ of any branch can be deleted. "
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "409":
          $ref: "#/components/responses/ClientError409"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/models/{name}/editions/{key}/close:
    parameters:
    - $ref: "#/components/parameters/model-name"
    - $ref: "#/components/parameters/edition-key"
    post:
      operationId: "closeModelEdition"
      summary: "Close model edition"
      tags:
      - "Models"
      description: "Closes a model edition whose name and key are given in the path,\
        \ and then opens a new edition of the model.\n\nWhen the operation completes\
        \ successfully, the response is a redirection (HTTP 303: See Other) to the\
        \ newly opened model edition information."
      requestBody:
        $ref: "#/components/requestBodies/ModelEditionClose"
      responses:
        "303":
          $ref: "#/components/responses/Redirection303"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/models/{name}/editions/{key}/branch:
    parameters:
    - $ref: "#/components/parameters/model-name"
    - $ref: "#/components/parameters/edition-key"
    post:
      operationId: "branchModelEdition"
      summary: "Create new branch"
      tags:
      - "Models"
      description: "Creates a new branch and a first model edition in this branch,\
        \ based on the model whose name and key are given in the path.\n\n\nWhen the\
        \ operation completes successfully, the response is a redirection (HTTP 303:\
        \ See Other) to the newly opened model edition information."
      requestBody:
        $ref: "#/components/requestBodies/BranchCreate"
      responses:
        "303":
          $ref: "#/components/responses/Redirection303"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/models/{name}/editions/{key}/content:
    parameters:
    - $ref: "#/components/parameters/model-name"
    - $ref: "#/components/parameters/edition-key"
    get:
      operationId: "exportModelEdition"
      summary: "Export model edition"
      tags:
      - "Models"
      description: "Exports a model edition whose name and key are given in the path."
      responses:
        "200":
          $ref: "#/components/responses/ModelEdition"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
    post:
      operationId: "importModelEdition"
      summary: "Import-Replace model edition"
      tags:
      - "Models"
      description: "Imports the request file to replace the model edition whose name\
        \ and key are given in the path.\n\nThis operation corresponds to the *Import\
        \ Replace* action."
      requestBody:
        $ref: "#/components/requestBodies/ModelEdition"
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/models/{name}/editions/{key}/translations:
    parameters:
    - $ref: "#/components/parameters/model-name"
    - $ref: "#/components/parameters/edition-key"
    get:
      operationId: "exportModelEditionTranslations"
      summary: "Export translations"
      tags:
      - "Models"
      description: "Exports the translations for a model edition whose name and key\
        \ are given in the path."
      responses:
        "200":
          $ref: "#/components/responses/ModelEditionTranslations"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
    post:
      operationId: "importModelEditionTranslations"
      summary: "Import translations"
      tags:
      - "Models"
      description: "Imports the request file as the translations for the model edition\
        \ whose name and key are given in the path."
      requestBody:
        $ref: "#/components/requestBodies/ModelEditionTranslations"
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations:
    get:
      operationId: "getDataLocations"
      summary: "List data locations"
      tags:
      - "Data Locations"
      description: "Returns a list of the data locations available in the repository."
      responses:
        "200":
          $ref: "#/components/responses/DataLocationMetadataList"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
    post:
      operationId: "createDataLocation"
      summary: "Create data location"
      tags:
      - "Data Locations"
      description: "Creates a new data location and deploys the model edition whose\
        \ model name and key is provided in the request (Note: only available for\
        \ active nodes)."
      requestBody:
        $ref: "#/components/requestBodies/DataLocationCreate"
      responses:
        "201":
          $ref: "#/components/responses/Success201"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations/{dloc-name}:
    parameters:
    - $ref: "#/components/parameters/data-location-name"
    get:
      operationId: "getDataLocation"
      summary: "Get data location information"
      tags:
      - "Data Locations"
      description: "Returns the details of the data location whose name is given in\
        \ the path."
      responses:
        "200":
          $ref: "#/components/responses/DataLocationMetadata"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations/{dloc-name}/delete:
    parameters:
    - $ref: "#/components/parameters/data-location-name"
    post:
      operationId: "deleteDataLocation"
      summary: "Delete data location"
      tags:
      - "Data Locations"
      description: "Deletes the data location whose name is given in the path, optionally\
        \ deleting the contents of the data location schema (Note: only available\
        \ for active nodes).\n\nThis operation cannot be undone.\n\n**Deleting the\
        \ contents of the data location schema deletes all the data stored in this\
        \ schema.**"
      requestBody:
        $ref: "#/components/requestBodies/DataLocationDelete"
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations/{dloc-name}/upgrade:
    parameters:
    - $ref: "#/components/parameters/data-location-name"
    post:
      operationId: "upgradeDataLocation"
      summary: "Upgrade data location"
      tags:
      - "Data Locations"
      description: "Upgrades the data location whose name is given in the path (Note:\
        \ only available for active nodes).\n\nWhen the operation completes successfully,\
        \ the response is a redirection (HTTP 303: See Other) to the data location\
        \ information."
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations/{dloc-name}/deploy:
    parameters:
    - $ref: "#/components/parameters/data-location-name"
    post:
      operationId: "deployModelEdition"
      summary: "Deploy model edition"
      tags:
      - "Data Locations"
      description: "Deploys a model edition to the data location whose name and key\
        \ are given in the path (Note: only available for active nodes).\n\nThe name\
        \ and key of the model to deploy are provided in the request.\n\nWhen the\
        \ operation completes successfully, the status of the response is HTTP 204.\n\
        \nIf the datalocation is in **INSTALL_JOB_FAILED** status, the request restarts\
        \ the installation job."
      requestBody:
        $ref: "#/components/requestBodies/DataLocationDeploy"
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations/{dloc-name}/set-status:
    parameters:
    - $ref: "#/components/parameters/data-location-name"
    post:
      operationId: "setDataLocationStatus"
      summary: "Set Status"
      tags:
      - "Data Locations"
      description: "Changes the status of the data location whose name and key are\
        \ given in the path (Note: only available for active nodes)."
      requestBody:
        $ref: "#/components/requestBodies/DataLocationChangeStatus"
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations/{dloc-name}/purge-jobs:
    parameters:
    - $ref: "#/components/parameters/data-location-name"
    post:
      operationId: "purgeJobs"
      summary: "Purge jobs"
      tags:
      - "Data Locations"
      description: "Purges the job logs for the data location whose name is given\
        \ in the path, according to the filter defined in the request payload.\n\n\
        The request contains a list of criteria that should all be valid for a job\
        \ to be considered for the purge. Each criteria filters the purged jobs according\
        \ to one property of the jobs. A missing attribute means “all possible values”"
      requestBody:
        $ref: "#/components/requestBodies/PurgeJobs"
      responses:
        "200":
          $ref: "#/components/responses/PurgeJobsResult"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations/{dloc-name}/purge-deployment-history:
    parameters:
    - $ref: "#/components/parameters/data-location-name"
    post:
      operationId: "purgeDeploymentHistory"
      summary: "Purge deployment history"
      tags:
      - "Data Locations"
      description: "Purges the deployment history for the data location whose name\
        \ is given in the path, according to the filter defined in the request payload.\n\
        \nThe request contains a list of optional criteria that should all be valid\
        \ for a deployment history record to be considered for the purge."
      requestBody:
        $ref: "#/components/requestBodies/PurgeDeploymentHistory"
      responses:
        "200":
          $ref: "#/components/responses/PurgeDeploymentHistoryResult"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations/{dloc-name}/notification-policies:
    parameters:
    - $ref: "#/components/parameters/data-location-name"
    get:
      operationId: "getNotificationPolicies"
      summary: "Get notification policies"
      tags:
      - "Notification Policies"
      description: "Returns a list of the notification policies with their configuration.\n\
        \nYou can use this response as a request to replace all notification policies."
      responses:
        "200":
          $ref: "#/components/responses/NotificationPolicyMetadataList"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
    put:
      operationId: "setNotificationPolicies"
      summary: "Replace notification policies"
      tags:
      - "Notification Policies"
      description: "Deletes all existing notification policies and creates the notification\
        \ policies provided in the request."
      requestBody:
        $ref: "#/components/requestBodies/NotificationPolicyMetadataList"
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations/{dloc-name}/notification-policies/{name}:
    parameters:
    - $ref: "#/components/parameters/data-location-name"
    - $ref: "#/components/parameters/notification-policy-name"
    get:
      operationId: "getNotificationPolicy"
      summary: "Get notification policy"
      tags:
      - "Notification Policies"
      description: "Returns the configuration of the notification policy whose name\
        \ is given in the path.\n\nYou can use this response as a request to set a\
        \ notification policy."
      responses:
        "200":
          $ref: "#/components/responses/NotificationPolicyMetadata"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
    put:
      operationId: "putNotificationPolicy"
      summary: "Set notification policy"
      tags:
      - "Notification Policies"
      description: "Create a new notification policy or update an existing notification\
        \ policy. The policy name is given in the path.\n\nNote that this operation\
        \ updates all configuration properties. A missing property is set to null\
        \ in the target notification policy."
      requestBody:
        $ref: "#/components/requestBodies/NotificationPolicyMetadata"
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
    delete:
      operationId: "deleteNotificationPolicy"
      summary: "Delete notification policy"
      tags:
      - "Notification Policies"
      description: "Deletes the notification policy whose name is given in the path."
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
