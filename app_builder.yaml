    get:
      operationId: "getContinuousLoads"
      summary: "Get continuous loads"
      tags:
      - "Continuous Loads"
      description: "Returns a list of the continuous loads with their configuration.\n\
        \nYou can use this response as a request to replace all continuous loads."
      responses:
        "200":
          $ref: "#/components/responses/ContinuousLoadOutMetadataList"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
    put:
      operationId: "setContinuousLoads"
      summary: "Replace continuous loads"
      tags:
      - "Continuous Loads"
      description: "Deletes all existing continuous loads and creates the continuous\
        \ loads provided in the request.\n\n**Replacing all continuous loads deletes\
        \ and recreates all loads. As a consequence, loads with the same name will\
        \ have new Load IDs.**"
      requestBody:
        $ref: "#/components/requestBodies/ContinuousLoadInMetadataList"
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations/{dloc-name}/continuous-loads/{name}:
