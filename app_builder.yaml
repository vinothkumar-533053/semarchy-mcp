      tags:
      - "Data Notifications"
      description: "Deletes all existing data notifications and creates the data notifications\
        \ provided in the request.\nReplacing all data notifications deletes all existing\
        \ notifications with their logs and recreates all notifications from the payload."
      requestBody:
        $ref: "#/components/requestBodies/DataNotificationMetadataList"
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "500":
          $ref: "#/components/responses/ServerError500"
  /app-builder/data-locations/{dloc-name}/data-notifications/{name}:
    parameters:
    - $ref: "#/components/parameters/data-location-name"
    - $ref: "#/components/parameters/data-notification-name"
    get:
      operationId: "getDataNotification"
      summary: "Get data notification"
      tags:
      - "Data Notifications"
      description: "Returns the configuration of the data notification whose name\
        \ is given in the path.\nYou can use this response as a request to set a data\
        \ notification."
      responses:
        "200":
          $ref: "#/components/responses/DataNotificationMetadata"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
    put:
      operationId: "putDataNotification"
      summary: "Set data notification"
      tags:
      - "Data Notifications"
      description: "Create a new data notification or update an existing data notification.\
        \ The data notification name is given in the path.\nNote that this operation\
        \ updates all configuration properties. A missing property is set to null\
        \ in the target data notification."
      requestBody:
        $ref: "#/components/requestBodies/DataNotificationMetadata"
      responses:
        "204":
          $ref: "#/components/responses/Success204"
        "400":
          $ref: "#/components/responses/ClientError400"
        "401":
          $ref: "#/components/responses/ClientError401"
        "403":
          $ref: "#/components/responses/ClientError403"
        "404":
          $ref: "#/components/responses/ClientError404"
        "500":
          $ref: "#/components/responses/ServerError500"
    patch:
      operationId: "patchDataNotification"
